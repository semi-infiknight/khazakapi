<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kazakh API ~ API Reference</title>
    <meta name="description" content="Interactive API reference for Kazakh API — Scalar-powered docs with try-it-out, code snippets, and Postman import." />
    <style>
      html, body { margin: 0; height: 100%; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        background: #0a0015;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .brand { font-weight: 700; letter-spacing: 0.2em; color: #c9cfd6; }
      .links { display: flex; gap: 14px; flex-wrap: wrap; }
      .links a { color: #c9cfd6; text-decoration: none; }
      .links a:hover { text-decoration: underline; }
      #api-reference { min-height: calc(100vh - 41px); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">KAZAKH API · REFERENCE</div>
      <nav class="links">
        <a href="/">Directory</a>
        <a href="/docs.html">Docs</a>
        <a href="/postman.json" download>Postman collection</a>
        <a href="/openapi.json">OpenAPI</a>
        <a href="/swagger.html">Swagger UI</a>
      </nav>
    </header>
    <script id="api-reference" type="application/json">
      {
        "url": "/openapi.json",
        "theme": "saturn",
        "layout": "modern",
        "darkMode": true,
        "searchHotKey": "k",
        "hideDownloadButton": false,
        "metaData": { "title": "Kazakh API" }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
